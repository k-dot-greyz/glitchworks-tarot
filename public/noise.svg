<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Self-authored grain texture for .noise-overlay (glitchworks-tarot). -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="7" stitchTiles="stitch" result="turb"/>
    <feBlend in="SourceGraphic" in2="turb" mode="screen"/>
  </filter>
  <rect width="100%" height="100%" fill="#000" fill-opacity="0" filter="url(#grain)" opacity="0.5"/>
</svg>
