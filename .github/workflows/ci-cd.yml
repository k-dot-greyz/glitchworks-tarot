name: CI/CD Pipeline

env:
  NPM_FLAGS: --legacy-peer-deps

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci ${{ env.NPM_FLAGS }}
      - name: Lint code
        run: npm run lint
      - name: Run tests
        run: npm run test -- --coverage
      - name: Build project
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: build/

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci ${{ env.NPM_FLAGS }}
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: build/
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

  deploy:
    needs: [build, e2e]
    # secrets context is not available in jobs.<id>.if (github/needs/vars/inputs only).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
    steps:
      - name: Checkout code
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_PATH != ''
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download build artifacts
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_PATH != ''
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: build/
      - name: Deploy to Production Server
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_PATH != ''
        run: |
          rsync -av --delete build/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
      - name: Notify Linear
        if: env.LINEAR_API_KEY != '' && env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_PATH != ''
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINEAR_API_KEY" \
            -d '{"event": "deploy", "branch": "${{ github.ref }}"}' \
            https://api.linear.app/webhooks/deployment
      - name: Skip deploy when secrets are unset
        if: env.DEPLOY_HOST == '' || env.DEPLOY_USER == '' || env.DEPLOY_PATH == ''
        run: echo "DEPLOY_* secrets not configured; skipping production deploy."
